name: Auto Update TVRUS

on:
  schedule:
    - cron: '0 0 * * *' # Запуск раз в сутки
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Download Reliable M3U
      run: |
        curl -s https://github.io > iprustv.m3u
        echo "Плейлист успешно скопирован из базы iptv-org!"

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add iprustv.m3u
        git commit -m "Sync with iptv-org database" || exit 0
        git push






