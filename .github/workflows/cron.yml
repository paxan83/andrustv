name: Auto Update TVRUS

on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа автоматического обновления
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests

    - name: Run update script
      run: python update_tvrus.py

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add iprustv.m3u
        git commit -m "Auto-update TVRUS stream token" || exit 0
        git push



