name: Auto Update TVRUS

on:
  schedule:
    - cron: '0 0 * * *' # Скрипт запускается сам каждую ночь без вашего участия
  workflow_dispatch: # Оставляет кнопку ручного запуска для проверки

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Get Stream from IPTV Database
      run: |
        # Скачиваем проверенный рабочий поток канала TVRUS из глобального архива iptv-org
        STREAM=$(curl -s "https://github.io" | grep -oE 'https://t62a.com[^"]+\.m3u8' | head -n 1)
        
        # Если глобальная база обновилась, записываем ссылку, если нет — используем стабильный резерв
        if [ -n "$STREAM" ]; then
          echo "#EXTM3U" > iprustv.m3u
          echo '#EXTINF:-1 tvg-id="TVRUS.de" tvg-name="TVRUS" group-title="International", TVRUS' >> iprustv.m3u
          echo "$STREAM" >> iprustv.m3u
        else
          echo "#EXTM3U" > iprustv.m3u
          echo '#EXTINF:-1 tvg-id="TVRUS.de" tvg-name="TVRUS" group-title="International", TVRUS' >> iprustv.m3u
          echo "https://t62a.com1794011287/Dbc20JL475-QhIAfszCwyw/bemtv/stream409/stream0.m3u8" >> iprustv.m3u
        fi

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add iprustv.m3u
        git commit -m "Auto-sync TVRUS stream from database" || exit 0
        git push













